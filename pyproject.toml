[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "projection"
version = "0.1.0"
description = "Read-model projection handler for an Amazon MSK event source mapping"
requires-python = ">=3.12"

# No runtime dependencies. boto3 is provided by the Lambda runtime and imported lazily in
# store.py, so the offline tests need neither it nor credentials.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
